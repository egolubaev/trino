#single node install config
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
# discovery-server.enabled removed in Trino 481 (embedded discovery is always on for the coordinator)
internal-communication.https.required=true

http-server.authentication.type=PASSWORD
http-server.http.enabled=true
# allow the Web UI / password login over plain HTTP on :8080 (dev only)
http-server.authentication.allow-insecure-over-http=true
http-server.https.enabled=true
http-server.https.port=8443
internal-communication.shared-secret=password
discovery.uri=https://localhost:8443
#discovery.uri=http://localhost:8080

# CTE-materialization orphan scratch sweeper (short interval/min-age for testing)
cte-materialization.orphan-sweep.schemas=lakehouse.cte_bench
cte-materialization.orphan-sweep.interval=20s
cte-materialization.orphan-sweep.min-age=5s
